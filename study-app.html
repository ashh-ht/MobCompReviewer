<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGNAL — Mobile Computing &amp; JavaScript Study Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0E17;
  --panel:#121826;
  --panel-2:#1A2233;
  --panel-3:#212C42;
  --line:#2A3550;
  --line-soft:#1D2740;
  --text:#EDEFF6;
  --muted:#8B93A8;
  --muted-2:#5E6982;
  --accent:#33E4A6;
  --accent-dim:#1D9E75;
  --accent-bg:rgba(51,228,166,0.1);
  --amber:#F5A623;
  --amber-bg:rgba(245,166,35,0.1);
  --coral:#FF6B6B;
  --coral-bg:rgba(255,107,107,0.1);
  --blue:#5B8CFF;
  --blue-bg:rgba(91,140,255,0.1);
  --font-display:'Space Grotesk',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
  --font-body:'Inter',sans-serif;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(51,228,166,0.06), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(91,140,255,0.05), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent);color:#06110C;}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 80px;}

/* ---------- HEADER ---------- */
header.app-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:12px;}
.brand svg{flex:0 0 auto;}
.brand h1{font-family:var(--font-display);font-size:22px;font-weight:700;margin:0;letter-spacing:0.5px;}
.brand h1 span{color:var(--accent);}
.brand p{margin:2px 0 0;font-family:var(--font-mono);font-size:11px;color:var(--muted-2);letter-spacing:1.5px;text-transform:uppercase;}

.tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line-soft);padding:5px;border-radius:12px;}
.tab-btn{
  font-family:var(--font-mono);font-size:12.5px;letter-spacing:0.5px;
  background:transparent;border:none;color:var(--muted);
  padding:9px 14px;border-radius:8px;cursor:pointer;
  transition:all .18s ease; white-space:nowrap;
}
.tab-btn:hover{color:var(--text);background:var(--panel-3);}
.tab-btn.active{background:var(--accent);color:#06170F;font-weight:600;}

main{animation:fadeIn .35s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.section-title{font-family:var(--font-display);font-size:19px;font-weight:700;margin:0 0 4px;}
.section-sub{font-family:var(--font-mono);font-size:12px;color:var(--muted-2);margin:0 0 20px;letter-spacing:0.3px;}

/* ---------- CONTROL BAR ---------- */
.controlbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px;align-items:center;}
.chip-group{display:flex;gap:6px;flex-wrap:wrap;}
.chip{
  font-family:var(--font-mono);font-size:11.5px;padding:7px 12px;border-radius:20px;
  border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;
  transition:all .15s ease;letter-spacing:0.3px;
}
.chip:hover{border-color:var(--accent-dim);color:var(--text);}
.chip.on{background:var(--accent);border-color:var(--accent);color:#06170F;font-weight:600;}

/* ---------- FLASHCARDS ---------- */
.flash-stage{display:flex;flex-direction:column;align-items:center;gap:16px;}
.flash-progress{font-family:var(--font-mono);font-size:12px;color:var(--muted-2);}
.card-flash{
  width:100%;max-width:560px;height:280px;perspective:1400px;cursor:pointer;
}
.card-flash-inner{
  position:relative;width:100%;height:100%;
  transition:transform .55s cubic-bezier(.2,.9,.25,1);
  transform-style:preserve-3d;
}
.card-flash.flipped .card-flash-inner{transform:rotateY(180deg);}
.card-face{
  position:absolute;inset:0;backface-visibility:hidden;
  border-radius:20px;border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:32px;background:var(--panel);
  box-shadow:0 20px 50px -20px rgba(0,0,0,0.6);
}
.card-face.front{background:linear-gradient(150deg,var(--panel-2),var(--panel));}
.card-face.back{transform:rotateY(180deg);background:linear-gradient(150deg,#0F2A22,var(--panel-2));border-color:var(--accent-dim);}
.card-eyebrow{font-family:var(--font-mono);font-size:10.5px;color:var(--muted-2);letter-spacing:2px;text-transform:uppercase;margin-bottom:14px;}
.card-term{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1.25;}
.card-def{font-size:15.5px;line-height:1.55;color:#DCE2EF;}
.card-hint{position:absolute;bottom:14px;font-family:var(--font-mono);font-size:10px;color:var(--muted-2);letter-spacing:0.5px;}

.flash-actions{display:flex;gap:10px;margin-top:4px;}
.btn{
  font-family:var(--font-body);font-weight:600;font-size:13.5px;
  padding:10px 18px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);color:var(--text);cursor:pointer;transition:all .15s ease;
  display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{border-color:var(--muted-2);transform:translateY(-1px);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#06170F;}
.btn.primary:hover{background:#2ED09A;}
.btn.ghost{background:transparent;}
.btn.danger-o{border-color:var(--coral);color:var(--coral);}
.btn.warn-o{border-color:var(--amber);color:var(--amber);}
.btn.small{padding:7px 12px;font-size:12px;}
.btn:disabled{opacity:0.35;cursor:not-allowed;transform:none;}

.flash-nav{display:flex;gap:14px;align-items:center;}
.iconbtn{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);
  color:var(--text);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;
}
.iconbtn:hover{border-color:var(--accent-dim);}

/* signal meter (signature element) */
.signal-meter{display:flex;align-items:flex-end;gap:3px;height:22px;}
.signal-meter i{width:5px;border-radius:2px;background:var(--line);transition:background .3s ease, height .3s ease;}
.signal-meter i:nth-child(1){height:6px;}
.signal-meter i:nth-child(2){height:11px;}
.signal-meter i:nth-child(3){height:16px;}
.signal-meter i:nth-child(4){height:22px;}
.signal-meter.l1 i:nth-child(1){background:var(--coral);}
.signal-meter.l2 i:nth-child(1),.signal-meter.l2 i:nth-child(2){background:var(--amber);}
.signal-meter.l3 i:nth-child(1),.signal-meter.l3 i:nth-child(2),.signal-meter.l3 i:nth-child(3){background:var(--accent-dim);}
.signal-meter.l4 i{background:var(--accent);}

/* ---------- GRID PANELS ---------- */
.panel{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--radius);padding:20px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:720px){.grid-2{grid-template-columns:1fr;}.grid-3{grid-template-columns:1fr;}}

/* ---------- QUIZ SETUP ---------- */
.setup-block{margin-bottom:20px;}
.setup-label{font-family:var(--font-mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted-2);margin-bottom:10px;display:block;}
.count-badge{font-family:var(--font-mono);font-size:12px;color:var(--accent);margin-left:8px;}

/* ---------- QUIZ SESSION ---------- */
.quiz-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.progress-track{height:6px;background:var(--panel-3);border-radius:6px;overflow:hidden;flex:1;min-width:160px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent-dim),var(--accent));border-radius:6px;transition:width .3s ease;}
.qcounter{font-family:var(--font-mono);font-size:12px;color:var(--muted);white-space:nowrap;}

.badge{font-family:var(--font-mono);font-size:10.5px;padding:4px 9px;border-radius:20px;letter-spacing:0.5px;text-transform:uppercase;display:inline-block;}
.badge.easy{background:var(--accent-bg);color:var(--accent);}
.badge.medium{background:var(--amber-bg);color:var(--amber);}
.badge.hard{background:var(--coral-bg);color:var(--coral);}
.badge.mc{background:var(--blue-bg);color:var(--blue);}
.badge.enum{background:rgba(180,120,255,0.12);color:#C79DFF;}
.badge.id{background:rgba(255,255,255,0.07);color:var(--muted);}

.qcard{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--radius);padding:26px;}
.qtags{display:flex;gap:6px;margin-bottom:14px;}
.qtext{font-family:var(--font-display);font-size:19px;font-weight:600;line-height:1.4;margin:0 0 20px;}

.opt-list{display:flex;flex-direction:column;gap:9px;}
.opt{
  text-align:left;padding:13px 16px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel-2);color:var(--text);cursor:pointer;font-size:14.5px;
  transition:all .15s ease;display:flex;align-items:center;gap:10px;font-family:var(--font-body);
}
.opt:hover{border-color:var(--accent-dim);background:var(--panel-3);}
.opt .k{font-family:var(--font-mono);font-size:11px;color:var(--muted-2);border:1px solid var(--line);border-radius:5px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.opt.correct{border-color:var(--accent);background:var(--accent-bg);}
.opt.correct .k{border-color:var(--accent);color:var(--accent);}
.opt.incorrect{border-color:var(--coral);background:var(--coral-bg);}
.opt.incorrect .k{border-color:var(--coral);color:var(--coral);}
.opt.dim{opacity:0.5;}
.opt:disabled,.opt.locked{cursor:default;}

.free-input{
  width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
  color:var(--text);font-family:var(--font-body);font-size:14.5px;padding:13px 16px;resize:vertical;
}
.free-input:focus{outline:none;border-color:var(--accent-dim);}
.field-error{color:var(--coral);font-size:12.5px;font-family:var(--font-mono);margin-top:8px;display:none;}

.feedback-box{margin-top:18px;padding:14px 16px;border-radius:10px;font-size:13.5px;line-height:1.5;display:none;}
.feedback-box.show{display:block;animation:fadeIn .25s ease;}
.feedback-box.good{background:var(--accent-bg);border:1px solid var(--accent-dim);color:#BFF3DE;}
.feedback-box.bad{background:var(--coral-bg);border:1px solid var(--coral);color:#FFD3D3;}
.feedback-box.partial{background:var(--amber-bg);border:1px solid var(--amber);color:#FFE3B0;}
.feedback-box b{color:var(--text);}

.qfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}

@keyframes shakeX{10%,90%{transform:translateX(-1px);}20%,80%{transform:translateX(2px);}30%,50%,70%{transform:translateX(-4px);}40%,60%{transform:translateX(4px);}}
.shake{animation:shakeX .4s ease;}

/* ---------- RESULTS ---------- */
.result-hero{text-align:center;padding:30px 10px 10px;}
.result-score{font-family:var(--font-display);font-size:56px;font-weight:700;color:var(--accent);line-height:1;}
.result-score span{font-size:24px;color:var(--muted);}
.result-msg{font-family:var(--font-mono);font-size:12.5px;color:var(--muted);margin-top:8px;letter-spacing:0.5px;}
.result-breakdown{display:flex;flex-direction:column;gap:8px;margin:24px 0;}
.rb-row{display:flex;align-items:center;gap:12px;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:10px;padding:10px 14px;}
.rb-label{font-size:13px;flex:1;}
.rb-icon{font-size:16px;width:20px;text-align:center;flex:0 0 auto;}

/* ---------- KEYWORDS ---------- */
.kw-search{
  width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text);
  font-family:var(--font-mono);font-size:13px;padding:11px 14px;margin-bottom:18px;
}
.kw-search:focus{outline:none;border-color:var(--accent-dim);}
.kw-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
@media(max-width:680px){.kw-grid{grid-template-columns:1fr;}}
.kw-card{
  background:var(--panel);border:1px solid var(--line-soft);border-radius:12px;padding:16px 18px;cursor:pointer;
  transition:border-color .15s ease;
}
.kw-card:hover{border-color:var(--accent-dim);}
.kw-mod{font-family:var(--font-mono);font-size:10px;color:var(--muted-2);letter-spacing:1px;text-transform:uppercase;}
.kw-term{font-family:var(--font-display);font-weight:700;font-size:15.5px;margin:4px 0 8px;}
.kw-phrase{
  display:inline-block;font-family:var(--font-mono);font-size:12px;color:var(--accent);
  background:var(--accent-bg);border:1px solid var(--accent-dim);border-radius:20px;padding:4px 11px;margin-bottom:9px;
}
.kw-meaning{font-size:13px;color:var(--muted);line-height:1.5;display:none;}
.kw-card.open .kw-meaning{display:block;}
.kw-card.open{background:var(--panel-2);}

/* ---------- MATCH GAME ---------- */
.match-box{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--radius);padding:24px;margin-bottom:24px;}
.match-phrase{font-family:var(--font-mono);font-size:13px;color:var(--accent);text-align:center;padding:16px;background:var(--accent-bg);border:1px dashed var(--accent-dim);border-radius:10px;margin-bottom:16px;}
.match-opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
@media(max-width:600px){.match-opts{grid-template-columns:1fr;}}
.match-score{font-family:var(--font-mono);font-size:12px;color:var(--muted);text-align:center;margin-top:14px;}

/* ---------- PROGRESS ---------- */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
@media(max-width:720px){.stat-row{grid-template-columns:repeat(2,1fr);}}
.stat-card{background:var(--panel);border:1px solid var(--line-soft);border-radius:12px;padding:16px;}
.stat-num{font-family:var(--font-display);font-size:26px;font-weight:700;}
.stat-lbl{font-family:var(--font-mono);font-size:10.5px;color:var(--muted-2);letter-spacing:1px;text-transform:uppercase;margin-top:4px;}

.mastery-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line-soft);}
.mastery-row:last-child{border-bottom:none;}
.mastery-name{width:190px;font-size:13.5px;flex:0 0 auto;}
.mastery-bar-track{flex:1;height:9px;background:var(--panel-3);border-radius:6px;overflow:hidden;}
.mastery-bar-fill{height:100%;border-radius:6px;transition:width .5s ease;}
.mastery-pct{font-family:var(--font-mono);font-size:12px;color:var(--muted);width:42px;text-align:right;flex:0 0 auto;}

.attempt-table{width:100%;border-collapse:collapse;font-size:13px;}
.attempt-table th{text-align:left;font-family:var(--font-mono);font-size:10.5px;color:var(--muted-2);text-transform:uppercase;letter-spacing:0.8px;padding:8px 10px;border-bottom:1px solid var(--line);}
.attempt-table td{padding:10px;border-bottom:1px solid var(--line-soft);}
.attempt-table tr:last-child td{border-bottom:none;}
.empty-note{color:var(--muted-2);font-size:13px;font-family:var(--font-mono);padding:20px 0;text-align:center;}

footer.note{margin-top:40px;text-align:center;font-family:var(--font-mono);font-size:11px;color:var(--muted-2);letter-spacing:0.5px;}
</style>
</head>

<div class="wrap">

  <header class="app-head">
    <div class="brand">
      <svg width="38" height="38" viewBox="0 0 38 38" fill="none">
        <circle cx="19" cy="19" r="3" fill="#33E4A6"/>
        <circle cx="19" cy="19" r="9" stroke="#33E4A6" stroke-width="1.6" opacity="0.55"/>
        <circle cx="19" cy="19" r="16" stroke="#33E4A6" stroke-width="1.2" opacity="0.25"/>
      </svg>
      <div>
        <h1>SIGNAL<span>.</span>study</h1>
        <p>Mobile Computing &amp; JavaScript — tune in to mastery</p>
      </div>
    </div>
    <nav class="tabs" id="tabNav">
      <button class="tab-btn" data-tab="flash">Flashcards</button>
      <button class="tab-btn" data-tab="quiz">Quiz</button>
      <button class="tab-btn" data-tab="keywords">Keyword Phrases</button>
      <button class="tab-btn" data-tab="progress">Progress</button>
    </nav>
  </header>

  <main id="main"></main>

  <footer class="note">Progress is saved to your browser session automatically — no login needed.</footer>

<script>
/* =========================================================
   DATA
========================================================= */
const MODULES = [
  {id:'m1', short:'Module 1', name:'Mobile Computing'},
  {id:'m2', short:'Module 2', name:'JavaScript'}
];

const TOPICS = {
  'm1-1.1':'1.1 Overview', 'm1-1.2':'1.2 Evolution', 'm1-1.3':'1.3 Classification', 'm1-1.4':'1.4 Advantages/Disadvantages',
  'm2-2.1':'2.1 What is JS', 'm2-2.2':'2.2 Data Types & Variables', 'm2-2.3':'2.3 if...else', 'm2-2.4':'2.4 for loop',
  'm2-2.5':'2.5 Functions', 'm2-2.6':'2.6 Objects'
};

const FLASHCARDS = [
  {id:'f1',module:'m1',topic:'m1-1.1',term:'Mobile Computing',def:'Any computer devices you can use while on the move. It enables transmission of data, voice, and video wirelessly, without needing a fixed physical link.'},
  {id:'f2',module:'m1',topic:'m1-1.1',term:'3 Main Concepts of Mobile Computing',def:'Mobile Communication, Mobile Hardware, and Mobile Software.'},
  {id:'f3',module:'m1',topic:'m1-1.1',term:'Mobile Communication',def:'The infrastructure — protocols, services, bandwidth, portals — that ensures seamless, reliable communication and defines the data format.'},
  {id:'f4',module:'m1',topic:'m1-1.1',term:'Radio Wave-Oriented',def:'Since the media is unguided/unbounded, signals are carried over the air to devices capable of receiving and sending similar signals.'},
  {id:'f5',module:'m1',topic:'m1-1.1',term:'Mobile Hardware',def:'Devices or components that receive or access mobility services — laptops, smartphones, tablets, PDAs. Has a receptor medium and operates full-duplex.'},
  {id:'f6',module:'m1',topic:'m1-1.1',term:'Full-Duplex',def:"A device's capability to send and receive signals at the same time, without waiting for the other device to finish."},
  {id:'f7',module:'m1',topic:'m1-1.1',term:'Mobile Software',def:'The actual program that runs on the mobile hardware — the "engine" or operating system that operates the device.'},
  {id:'f8',module:'m1',topic:'m1-1.1',term:'Mobile Platforms',def:'The hardware-software environment for laptops, tablets, and smartphones (e.g. Windows/Mac lead laptops; Apple/Android lead smartphones & tablets).'},

  {id:'f9',module:'m1',topic:'m1-1.2',term:'Telecommuting',def:'Being able to work from home or the field while accessing resources as if you were in the office.'},
  {id:'f10',module:'m1',topic:'m1-1.2',term:'1G',def:'The first generation of mobile systems, introduced in 1981.'},
  {id:'f11',module:'m1',topic:'m1-1.2',term:'GSM',def:'Global System for Mobile Communications — a standard developed by ETSI describing protocols for 2G cellular networks; the default global standard as of 2014.'},
  {id:'f12',module:'m1',topic:'m1-1.2',term:'EDGE',def:'Enhanced Data Rates for GSM Evolution — expanded GSM to include data communications.'},
  {id:'f13',module:'m1',topic:'m1-1.2',term:'LTE',def:'Long-Term Evolution, also called 4G LTE — a standard for high-speed wireless data that increases a network\'s capacity and speed.'},
  {id:'f14',module:'m1',topic:'m1-1.2',term:'Mobile Market (2013)',def:'96% of the global population had mobile subscriptions (7 billion total); mobile broadband reached about 2.1 billion.'},
  {id:'f15',module:'m1',topic:'m1-1.2',term:'Mobile OS Web Traffic (Oct 2019)',def:'Android 76.2%, Apple iOS 22.5%, other mobile OS 1.3% of global mobile web requests, per Statcounter.'},

  {id:'f16',module:'m1',topic:'m1-1.3',term:'3 Classifications of Mobile Devices',def:'Personal Digital Assistant (PDA), Smartphones, and Tablet PC and iPads.'},
  {id:'f17',module:'m1',topic:'m1-1.3',term:'PDA',def:'Personal Digital Assistant — a portable electronic organizer/day planner. An extension of the PC, not a replacement. Has a stylus and a touch-sensitive screen.'},
  {id:'f18',module:'m1',topic:'m1-1.3',term:'Synchronization',def:'The process by which a PDA and computer share and update information with each other, often via infrared or Bluetooth.'},
  {id:'f19',module:'m1',topic:'m1-1.3',term:'Smartphone',def:'Combines PDA features with a mobile/camera phone. Runs multiple programs concurrently, has full web browsers, and high-speed data via Wi-Fi/cellular broadband.'},
  {id:'f20',module:'m1',topic:'m1-1.3',term:'Common Smartphone OS',def:"Android, iOS, Symbian, BlackBerry OS, Bada, Windows Phone, and embedded Linux distributions like Maemo and MeeGo."},
  {id:'f21',module:'m1',topic:'m1-1.3',term:'Tablet PC / iPad',def:'Larger than a phone or PDA; operated by touch (pen or finger), usually slate-shaped and light. Examples: iPad, Galaxy Tab, Blackberry Playbook.'},

  {id:'f22',module:'m1',topic:'m1-1.4',term:'Location Flexibility',def:'Users can work from anywhere with a connection, without being tied to a fixed position.'},
  {id:'f23',module:'m1',topic:'m1-1.4',term:'Saves Time',def:'Access to documents/files over a secure channel reduces travel time and unnecessary expenses; enhances telecommuting.'},

   STATE
========================================================= */
let State = {
  tab:'flash',
  flashModule:'all',
  flashIndex:0,
  flashFlipped:false,
  flashProgress:{},   // {cardId:'known'|'review'}
  quizConfig:null,
  quizSession:null,   // {questions:[], idx, answers:[], answered:bool}
  quizAttempts:[],    // persisted
  kwSearch:'',
  matchPool:[],
  matchCurrent:null,
  matchScore:{right:0,wrong:0}
};

const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));
const moduleName = id => (MODULES.find(m=>m.id===id)||{}).name || id;
const shuffle = arr => { const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

/* =========================================================
   PERSISTENCE
========================================================= */
async function loadState(){
  try{
    const r = await window.storage.get('flashcard-progress', false);
    if(r && r.value) State.flashProgress = JSON.parse(r.value);
  }catch(e){}
  try{
    const r = await window.storage.get('quiz-attempts', false);
    if(r && r.value) State.quizAttempts = JSON.parse(r.value);
  }catch(e){}
}
async function saveFlashProgress(){
  try{ await window.storage.set('flashcard-progress', JSON.stringify(State.flashProgress), false); }catch(e){}
}
async function saveAttempts(){
  try{ await window.storage.set('quiz-attempts', JSON.stringify(State.quizAttempts), false); }catch(e){}
}

/* =========================================================
   TAB NAV
========================================================= */
function setTab(tab){
  State.tab = tab;
  $$('.tab-btn').forEach(b=> b.classList.toggle('active', b.dataset.tab===tab));
  render();
}
$('#tabNav').addEventListener('click', e=>{
  const btn = e.target.closest('.tab-btn');
  if(btn) setTab(btn.dataset.tab);
});

function render(){
  if(State.tab==='flash') renderFlashcards();
  else if(State.tab==='quiz') renderQuiz();
  else if(State.tab==='keywords') renderKeywords();
  else if(State.tab==='progress') renderProgress();
}

/* =========================================================
   FLASHCARDS
========================================================= */
function currentFlashList(){
  return FLASHCARDS.filter(f => State.flashModule==='all' || f.module===State.flashModule);
}
function renderFlashcards(){
  const list = currentFlashList();
  if(State.flashIndex >= list.length) State.flashIndex = 0;
  const card = list[State.flashIndex];
  const known = Object.values(State.flashProgress).filter(v=>v==='known').length;

  const chips = ['all',...MODULES.map(m=>m.id)].map(id=>{
    const label = id==='all' ? 'All modules' : moduleName(id);

function goFlash(dir){

function masteryForCard(id){

function signalClass(level){

}

function startQuiz(){
  const cfg = State.quizConfig;
  const pool = shuffle(filterQuestions(cfg)).slice(0, cfg.count);
  State.quizSession = {
    questions: pool,
    idx: 0,
    results: [],   // {id,correct,partial}
    answered: false,
    selected: null
  };
  renderQuizSession();
}
function labelFor(cfg){
  const modL = cfg.module==='all' ? 'Both modules' : moduleName(cfg.module);
  const diffL = cfg.diff==='mixed' ? 'Mixed difficulty' : cfg.diff[0].toUpperCase()+cfg.diff.slice(1);
  const typeL = {mixed:'Mixed types',mc:'Multiple choice',enum:'Enumeration',id:'Identification'}[cfg.type];
  return {modL,diffL,typeL};
}
function renderQuizSession(){
  const sess = State.quizSession;
  const q = sess.questions[sess.idx];
  const pct = Math.round(100*sess.idx/sess.questions.length);

  $('#main').innerHTML = `
    <div class="quiz-head">
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <span class="qcounter">Question ${sess.idx+1} / ${sess.questions.length}</span>
    </div>
    <div class="qcard" id="qcard">
      <div class="qtags">
        <span class="badge ${q.diff}">${q.diff}</span>
        <span class="badge ${q.type}">${q.type==='mc'?'multiple choice':q.type==='enum'?'enumeration':'identification'}</span>
        <span class="badge" style="background:rgba(255,255,255,0.05);color:var(--muted)">${moduleName(q.module)}</span>
      </div>
      <p class="qtext">${q.q}</p>
      <div id="qbody"></div>
      <div class="feedback-box" id="feedback"></div>
      <div class="qfoot" id="qfoot"></div>
    </div>
  `;
  renderQuestionBody(q);
}
function renderQuestionBody(q){
  const body = $('#qbody');
  if(q.type==='mc'){
    const opts = q._shuffled || (q._shuffled = shuffle(q.options));
    body.innerHTML = `<div class="opt-list">${opts.map((o,i)=>
      `<button class="opt" data-mcopt="${encodeURIComponent(o)}"><span class="k">${String.fromCharCode(65+i)}</span>${o}</button>`
    ).join('')}</div>`;
    $$('[data-mcopt]').forEach(btn=>btn.addEventListener('click', ()=> submitMC(q, decodeURIComponent(btn.dataset.mcopt))));
  } else if(q.type==='enum'){
    body.innerHTML = `
      <textarea class="free-input" rows="3" placeholder="Type your answers separated by commas or new lines..." id="enumInput"></textarea>
      <div class="field-error" id="fieldErr">Type at least one answer before submitting.</div>
      <div class="qfoot"><button class="btn primary" id="submitEnum">Submit answer</button></div>
    `;
    $('#submitEnum').addEventListener('click', ()=>{
      const val = $('#enumInput').value.trim();
      if(!val){ $('#fieldErr').style.display='block'; return; }
      $('#fieldErr').style.display='none';
      submitEnum(q, val);
    });
  } else if(q.type==='id'){
    body.innerHTML = `
      <input type="text" class="free-input" placeholder="Type the term..." id="idInput">
      <div class="field-error" id="fieldErr">Type an answer before submitting.</div>
      <div class="qfoot"><button class="btn primary" id="submitId">Submit answer</button></div>
    `;
    $('#idInput').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); $('#submitId').click(); } });
    $('#submitId').addEventListener('click', ()=>{
      const val = $('#idInput').value.trim();
      if(!val){ $('#fieldErr').style.display='block'; return; }
      $('#fieldErr').style.display='none';
      submitId(q, val);
    });
  }
}
function normalize(s){ return s.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim(); }

function submitMC(q, chosen){
  if(State.quizSession.answered) return;
  State.quizSession.answered = true;
  const correct = chosen === q.answer;
  $$('.opt').forEach(btn=>{
    btn.disabled = true; btn.classList.add('locked');
    const val = decodeURIComponent(btn.dataset.mcopt);
    if(val === q.answer) btn.classList.add('correct');
    else if(val === chosen) btn.classList.add('incorrect');
    else btn.classList.add('dim');
  });
  showFeedback(correct ? 'good' : 'bad', correct ? `Correct — <b>${q.answer}</b>. ${q.exp||''}` : `Not quite. The correct answer is <b>${q.answer}</b>. ${q.exp||''}`);
  if(!correct) $('#qcard').classList.add('shake');
  recordResult(q.id, correct);
  showNextButton();
}
function submitEnum(q, raw){
  if(State.quizSession.answered) return;
  State.quizSession.answered = true;
  const userItems = raw.split(/[,\n]/).map(s=>normalize(s)).filter(Boolean);
  let matched = 0; const matchedNames = [];
  q.items.forEach(item=>{
    const norm = normalize(item);
    const hit = userItems.some(u => u.includes(norm) || norm.includes(u) && u.length>3);
    if(hit){ matched++; matchedNames.push(item); }
  });
  const need = q.minCorrect || q.items.length;
  const correct = matched >= need;
  const partial = !correct && matched > 0;
  const listAll = q.items.map(i=>`<li>${i}</li>`).join('');
  showFeedback(correct?'good':(partial?'partial':'bad'),
    `You matched <b>${matched} of ${q.items.length}</b> (needed ${need}). Full list:<ul style="margin:8px 0 0 18px;">${listAll}</ul>`);
  recordResult(q.id, correct, partial);
  showNextButton();
}
function submitId(q, raw){
  if(State.quizSession.answered) return;
  State.quizSession.answered = true;
  const norm = normalize(raw);
  const correct = q.accepts.some(a => norm === normalize(a) || norm.includes(normalize(a)) || normalize(a).includes(norm));
  showFeedback(correct?'good':'bad', correct ? `Correct — <b>${q.display}</b>.` : `Not quite. The correct term is <b>${q.display}</b>.`);
  if(!correct) $('#qcard').classList.add('shake');
  recordResult(q.id, correct);
  showNextButton();
}
function showFeedback(type, html){
  const fb = $('#feedback');
  fb.className = `feedback-box show ${type}`;
  fb.innerHTML = html;
}
function recordResult(id, correct, partial){
  State.quizSession.results.push({id, correct: !!correct, partial: !!partial});
}
function showNextButton(){
  const isLast = State.quizSession.idx === State.quizSession.questions.length - 1;
  $('#qfoot').innerHTML = `<button class="btn primary" id="nextQBtn">${isLast?'See results':'Next question'}</button>`;
  $('#nextQBtn').addEventListener('click', nextQuestion);
}
function nextQuestion(){
  const sess = State.quizSession;
  if(sess.idx < sess.questions.length - 1){
    sess.idx++; sess.answered = false;
    renderQuizSession();
  } else {
    finishQuiz();
  }
}
async function finishQuiz(){
  const sess = State.quizSession;
  const score = sess.results.filter(r=>r.correct).length;
  const total = sess.results.length;
  const {modL,diffL,typeL} = labelFor(State.quizConfig);
  const attempt = {
    id:'a'+Date.now(), time:Date.now(), score, total,
    moduleLabel:modL, diffLabel:diffL, typeLabel:typeL,
    detail: sess.results
  };
  State.quizAttempts.push(attempt);
  await saveAttempts();
  renderQuizResults(attempt);
}
function renderQuizResults(attempt){
  const pct = Math.round(100*attempt.score/attempt.total);
  const msg = pct===100 ? "Perfect run. That's mastery." : pct>=80 ? 'Strong signal — almost there.' : pct>=50 ? 'Decent reception — a bit more tuning needed.' : 'Weak signal — worth another pass.';

  const byQ = attempt.detail.map(r=>{
    const q = QUESTIONS.find(x=>x.id===r.id);
    return {q, r};
  });
  const wrong = byQ.filter(x=>!x.r.correct);

  $('#main').innerHTML = `
    <div class="qcard">
      <div class="result-hero">
        <div class="result-score">${attempt.score}<span>/${attempt.total}</span></div>
        <div class="result-msg">${msg} — ${pct}% correct</div>
      </div>
      <div class="result-breakdown">
        ${byQ.map(({q,r})=>`
          <div class="rb-row">
            <span class="rb-icon">${r.correct?'✅':(r.partial?'🟡':'❌')}</span>
            <span class="badge ${q.diff}" style="flex:0 0 auto;">${q.diff}</span>
            <span class="rb-label">${q.q.length>70?q.q.slice(0,70)+'…':q.q}</span>
          </div>
        `).join('')}
      </div>
      <div class="qfoot" style="justify-content:space-between;">
        <button class="btn ghost" id="backSetup">Change setup</button>
        <div style="display:flex;gap:10px;">
          <button class="btn" id="retrySame">Retry same setup</button>
          <button class="btn primary" id="viewProgress">View progress</button>
        </div>
      </div>
    </div>
    ${wrong.length ? `<div class="panel" style="margin-top:18px;">
      <span class="setup-label">Focus next: what to review</span>
      <div class="result-breakdown">
        ${wrong.map(({q})=>`<div class="rb-row"><span class="rb-icon">🎯</span><span class="rb-label"><b>${moduleName(q.module)}</b> — ${q.q}</span></div>`).join('')}
      </div>
    </div>` : ''}
  `;
  $('#backSetup').addEventListener('click', ()=>{ State.quizSession=null; renderQuiz(); });
  $('#retrySame').addEventListener('click', ()=>{ State.quizSession=null; startQuiz(); });
  $('#viewProgress').addEventListener('click', ()=>{ State.quizSession=null; setTab('progress'); });
}

function setupMatchGame(){

  else renderMatchRound();
}
function nextMatchRound(){
  const correct = KEYWORDS[Math.floor(Math.random()*KEYWORDS.length)];
  const distractors = shuffle(KEYWORDS.filter(k=>k.term!==correct.term)).slice(0,3);
  const options = shuffle([correct, ...distractors]);
  State.matchCurrent = {correct, options, answered:false};
  renderMatchRound();
}
function renderMatchRound(){
  const box = $('#matchArea');
  if(!box) return;
  const {correct, options, answered} = State.matchCurrent;
  box.innerHTML = `
    <div class="match-box">
      <div class="match-phrase">“${correct.phrase}”</div>
      <div class="match-opts">
        ${options.map(o=>`<button class="opt" data-matchterm="${encodeURIComponent(o.term)}">${o.term}</button>`).join('')}

    </div>
  `;
  $$('[data-matchterm]').forEach(btn=>btn.addEventListener('click', ()=>{
    if(State.matchCurrent.answered) return;
    State.matchCurrent.answered = true;
    const chosen = decodeURIComponent(btn.dataset.matchterm);
    const ok = chosen === correct.term;
    if(ok) State.matchScore.right++; else State.matchScore.wrong++;
    $$('[data-matchterm]').forEach(b=>{
      const val = decodeURIComponent(b.dataset.matchterm);
      if(val===correct.term) b.classList.add('correct');
      else if(val===chosen) b.classList.add('incorrect');
    });
    setTimeout(nextMatchRound, 900);
  }));
}

function renderProgress(){
  const known = Object.values(State.flashProgress).filter(v=>v==='known').length;
  const totalAttempts = State.quizAttempts.length;
  const totalQ = State.quizAttempts.reduce((s,a)=>s+a.total,0);
  const totalCorrect = State.quizAttempts.reduce((s,a)=>s+a.score,0);
  const overallPct = totalQ ? Math.round(100*totalCorrect/totalQ) : 0;

  // mastery by module/topic based on most recent result per question
  const latestByQ = {};
  State.quizAttempts.forEach(a=>{
    (a.detail||[]).forEach(r=>{ latestByQ[r.id] = r.correct; });
  });
  const topicStats = {};
  Object.keys(TOPICS).forEach(t=>topicStats[t]={correct:0,total:0});
  QUESTIONS.forEach(q=>{
    // approximate topic bucket by module only since questions aren't tagged per sub-topic
  });
  // module-level mastery (question bank has module-level granularity)
  const modStats = {};
  MODULES.forEach(m=>modStats[m.id]={correct:0,total:0});
  Object.entries(latestByQ).forEach(([qid, correct])=>{
    const q = QUESTIONS.find(x=>x.id===qid);
    if(!q) return;
    modStats[q.module].total++;
    if(correct) modStats[q.module].correct++;
  });

  const flashModStats = {};
  MODULES.forEach(m=>flashModStats[m.id]={known:0,total:0});
  FLASHCARDS.forEach(f=>{
    flashModStats[f.module].total++;
    if(State.flashProgress[f.id]==='known') flashModStats[f.module].known++;
  });

  $('#main').innerHTML = `
    <h2 class="section-title">Progress</h2>
    <p class="section-sub">Signal strength by topic — the lower the bar, the more it needs another pass.</p>

    <div class="stat-row">
      <div class="stat-card"><div class="stat-num">${known}/${FLASHCARDS.length}</div><div class="stat-lbl">Flashcards known</div></div>
      <div class="stat-card"><div class="stat-num">${totalAttempts}</div><div class="stat-lbl">Quiz attempts</div></div>
      <div class="stat-card"><div class="stat-num">${overallPct}%</div><div class="stat-lbl">Overall quiz accuracy</div></div>
      <div class="stat-card"><div class="stat-num">${Object.keys(latestByQ).length}/${QUESTIONS.length}</div><div class="stat-lbl">Unique questions attempted</div></div>
    </div>

    <div class="grid-2">
      <div class="panel">
        <span class="setup-label">Quiz mastery by module</span>
        ${MODULES.map(m=>{
          const s = modStats[m.id]; const pct = s.total? Math.round(100*s.correct/s.total):0;
          return masteryRow(m.name, pct, s.total? `${s.correct}/${s.total}` : 'not attempted');
        }).join('')}
      </div>
      <div class="panel">
        <span class="setup-label">Flashcards known by module</span>
        ${MODULES.map(m=>{
          const s = flashModStats[m.id]; const pct = s.total? Math.round(100*s.known/s.total):0;
          return masteryRow(m.name, pct, `${s.known}/${s.total}`);
        }).join('')}
      </div>
    </div>

    <div class="panel" style="margin-top:16px;">
      <span class="setup-label">Attempt history</span>
      ${State.quizAttempts.length ? `
      <table class="attempt-table">
        <thead><tr><th>When</th><th>Setup</th><th>Score</th></tr></thead>
        <tbody>
          ${State.quizAttempts.slice().reverse().map(a=>`<tr>
            <td>${new Date(a.time).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</td>
            <td>${a.moduleLabel} · ${a.diffLabel} · ${a.typeLabel}</td>
            <td>${a.score}/${a.total} (${Math.round(100*a.score/a.total)}%)</td>
          </tr>`).join('')}
        </tbody>
      </table>` : `<div class="empty-note">No quiz attempts yet. Head to the Quiz tab to get started.</div>`}
    </div>
  `;
}
function masteryRow(name, pct, sub){
  const color = pct>=80?'var(--accent)':pct>=50?'var(--amber)':'var(--coral)';

    <div class="mastery-name">${name}<div style="font-family:var(--font-mono);font-size:10.5px;color:var(--muted-2);">${sub}</div></div>
    <div class="mastery-bar-track"><div class="mastery-bar-fill" style="width:${pct}%;background:${color}"></div></div>

}
